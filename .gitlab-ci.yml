image:
  name: gcr.io/kaniko-project/executor:v1.14.0-debug
  entrypoint: [""]

stages:
  - build-push
  # - deploy

variables:
  # Image name on Docker Hub
  IMAGE_NAME: "${DOCKERHUB_USERNAME}/patina-backend"

build_and_push:
  stage: build-push
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:latest"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHA}"
      --cache=true
      --cache-ttl=24h
      --compressed-caching=false

